<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye 2024, Welcome 2025</title>
    <style>
        /* Basic page styling */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #2a2a72, #009ffd);
            animation: gradientAnimation 10s ease infinite; /* Gradient animation */
            position: relative;
            color: white;
            text-align: center;
        }

        /* Gradient background animation */
        @keyframes gradientAnimation {
            0% {
                background: linear-gradient(135deg, #2a2a72, #009ffd);
            }
            50% {
                background: linear-gradient(135deg, #ff6a00, #ee0979);
            }
            100% {
                background: linear-gradient(135deg, #2a2a72, #009ffd);
            }
        }

        /* Create starry effect in the background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/45-degree-fabric-light.png') repeat;
            z-index: -1;
            opacity: 0.5;
        }

        /* Firework animation using CSS */
        .fireworks {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            animation: fireworkAnimation 1.5s ease-in-out infinite;
        }

        @keyframes fireworkAnimation {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(3) translate(-200px, -200px);
                opacity: 0;
            }
        }

        /* Styling for the main container */
        .container {
            font-size: 5rem;
            font-weight: bold;
            position: relative;
            color: white;
        }

        /* Styling for each digit in the years */
        .year {
            display: inline-block;
            position: relative;
            transition: transform 1s ease-out;
        }

        .four {
            display: inline-block;
            animation: moveUp 2s ease forwards;
        }

        .five {
            display: inline-block;
            animation: moveDown 2s 2s ease forwards;
            opacity: 0;
        }

        /* Animation for the number 4 going up */
        @keyframes moveUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-100px);
            }
        }

        /* Animation for the number 5 coming down */
        @keyframes moveDown {
            0% {
                opacity: 1;
                transform: translateY(-100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .new-year {
            font-size: 3rem;
            color:black;
            margin-top: 50px;
            opacity: 0;
            animation: fadeInUp 2s 4s forwards;
        }

        /* Animation for the "Welcome 2025" text */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>
    <div class="stars"></div> <!-- Stars Background -->
    <div class="fireworks">
        <!-- Fireworks elements -->
        <div class="firework" style="top: 20%; left: 25%;"></div>
        <div class="firework" style="top: 30%; left: 50%;"></div>
        <div class="firework" style="top: 40%; left: 75%;"></div>
        <div class="firework" style="top: 60%; left: 15%;"></div>
        <div class="firework" style="top: 80%; left: 80%;"></div>
    </div>
    <div class="container">
        <span class="year">20</span>
        <span class="year four">4</span>
        <span class="year"></span>
        <span class="year five">5</span>
        <span class="year"></span>
        <span class="year"></span>
    </div>
    <div class="new-year">Welcome 2025!</div>
</body>
</html>
